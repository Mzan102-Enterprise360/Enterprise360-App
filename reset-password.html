<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14283b">
<title>MzanConnect | Reset Password</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#edf2f5;color:#14283b}
header{background:#14283b;color:#fff;text-align:center;padding:28px 20px}
main{max-width:440px;margin:35px auto;padding:20px}
.card{background:white;padding:28px 22px;border-radius:18px;box-shadow:0 2px 8px #0001}
label{display:block;margin-top:18px;font-weight:bold}
input{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid #b9c8d1;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;margin-top:20px;background:#147b59;color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}a{color:#147b59}
#message{margin-top:16px;line-height:1.5;display:none;background:#e4f3eb;padding:14px;border-radius:10px}
#message.error{background:#ffe8e8;color:#8a2424}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<header><h1>◈ MzanConnect</h1><p>Secure password recovery</p></header>
<main><div class="card">
<h2 id="heading">Forgot Password?</h2>
<p id="instructions">Enter your registered email address. If an account exists, you'll receive a password reset link.</p>
<form id="requestForm">
<label for="email">Registered email address</label><input id="email" type="email" autocomplete="email" required>
<button type="submit" id="requestButton">Send Reset Link</button>
</form>
<form id="updateForm" hidden>
<label for="newPassword">New password (at least 12 characters)</label>
<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirmPassword">Confirm new password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
<button type="submit" id="updateButton">Save New Password</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="login.html">Back to Member Login</a></p>
</div></main>
<script>
const client=window.supabase.createClient("https://akxzubckdebawqwwwaoe.supabase.co","sb_publishable_XEeBfPCzJ0MzGpHWHygeug_rGptbzno");
const message=document.getElementById("message");
function show(text,error=false){message.textContent=text;message.className=error?"error":"";message.style.display="block";}
function recoveryMode(){document.getElementById("requestForm").hidden=true;document.getElementById("updateForm").hidden=false;document.getElementById("heading").textContent="Choose a new password";document.getElementById("instructions").textContent="Enter a new password for your existing MzanConnect account.";}
client.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")recoveryMode();});
(async()=>{const params=new URLSearchParams(location.search);if(params.get("code")){const {error}=await client.auth.exchangeCodeForSession(params.get("code"));if(error)show("This reset link is invalid or expired. Please request a new one.",true);else recoveryMode();}else if(location.hash.includes("type=recovery")){const {data}=await client.auth.getSession();if(data.session)recoveryMode();}})();
document.getElementById("requestForm").addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("requestButton");button.disabled=true;try{const email=document.getElementById("email").value.trim();const redirectTo=new URL("reset-password.html",location.href).href;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;show("If this email is registered, a reset link will arrive shortly. Check your inbox and spam folder.");}catch(error){show(error.message||"Unable to request reset. Try again.",true);}finally{button.disabled=false;}});
document.getElementById("updateForm").addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("updateButton");const password=document.getElementById("newPassword").value;if(password!==document.getElementById("confirmPassword").value){show("Passwords do not match.",true);return;}button.disabled=true;try{const {error}=await client.auth.updateUser({password});if(error)throw error;await client.auth.signOut();document.getElementById("updateForm").hidden=true;show("Password updated. Return to Member Login and use your registered email address and new password.");}catch(error){show(error.message||"Unable to change password. Request a new link.",true);}finally{button.disabled=false;}});
</script><script defer src="voice-accessibility.js?v=6"></script><script defer src="app-shell.js?v=2"></script></body></html>
