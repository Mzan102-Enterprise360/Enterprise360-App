<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MzanConnect | Support Messages</title><style>body{font:16px system-ui;margin:0;background:#edf2f5;color:#14283b}header{background:#14283b;color:white;padding:22px}main{max-width:640px;margin:24px auto;padding:16px}.card{background:white;border-radius:14px;padding:20px}textarea{width:100%;min-height:110px;box-sizing:border-box;padding:12px;font:inherit}button{background:#147b59;color:white;border:0;border-radius:8px;padding:13px 20px;cursor:pointer}button:disabled{opacity:.5}.item{border-bottom:1px solid #ddd;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526675}a{color:#147b59}details>summary{cursor:pointer;font-weight:650;padding:10px 0}details form{margin-top:12px}.support-group{border-top:1px solid #dce5e9;margin-top:14px;padding-top:8px}.support-group small{font-weight:400}
/* Consistent mobile-friendly dashboard navigation; excluded from printed reports */
.dashboard-return{background:#fff;border:1px solid #dfe9ec;border-radius:16px;padding:20px 26px;margin:0 0 20px;box-shadow:0 5px 18px rgba(20,40,59,.06)}
.dashboard-return a,.actions .dashboard-return a{display:flex;align-items:center;justify-content:center;min-height:56px;width:100%;padding:12px 16px;border-radius:12px;background:#147b59;color:#fff;text-decoration:none;font-size:18px;font-weight:700;text-align:center}
.dashboard-return a:focus-visible{outline:3px solid #12a3a8;outline-offset:3px}
@media print{.dashboard-return{display:none!important}}

/* Compact, purposeful section header */
header{background:linear-gradient(115deg,#14283b 0%,#163d50 75%,#116a6a 100%);padding:22px 20px 24px;text-align:left}
header .header-brand{margin:0 0 12px;font-size:16px;font-weight:700;color:#d4e6eb}
header h1{margin:0 0 8px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#fff}
header p:not(.header-brand){margin:0;color:#dce8eb;line-height:1.45;font-size:15px}
/* Screenshot-led compact layout: keep all support functions intact */
@media screen {
main{margin:0 auto;padding:12px 14px 24px}
header{padding:14px 16px 16px}
header .header-brand{margin-bottom:5px}
header h1{margin-bottom:4px}
.dashboard-return{padding:9px 11px;margin:0 0 12px;border-radius:12px}
.dashboard-return a,.actions .dashboard-return a{min-height:46px;padding:10px 12px;font-size:16px}
.card{padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:clamp(21px,5vw,26px)}
.card p{margin:10px 0;line-height:1.45}
.support-group{margin-top:10px;padding-top:5px}
details>summary{padding:12px 0;min-height:44px}
button{min-height:44px}
}
/* Short pages use the viewport efficiently; expanded content scrolls naturally */
*,*::before,*::after{box-sizing:border-box}
@media screen {
html{min-height:100%;}
body{min-height:100dvh;overflow-x:hidden}
main{width:100%;max-width:640px;margin:0 auto;padding:10px 14px 18px}
.dashboard-return{padding:6px 8px;margin-bottom:9px}
.dashboard-return a{min-height:44px;padding:8px 12px}
.card{padding:14px;margin-bottom:10px}
.card h2{margin:0 0 10px}
.support-group{margin-top:8px;padding-top:4px}
}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script></head><body><header><p class="header-brand">◈ MzanConnect</p><h1>Member Support</h1><p>Send a request and review your support messages.</p></header><main><div class="dashboard-return"><a href="dashboard.html" aria-label="Back to dashboard">← Back to Dashboard</a></div><section class="card"><h2>Support requests</h2><button id="refreshSupport" type="button" disabled>Refresh support</button><details id="newRequest" class="support-group"><summary>Send a support request</summary><form id="form"><label for="message">Your message</label><textarea id="message" maxlength="2000" required></textarea><p><button id="send" type="submit">Save support request</button></p></form></details><p id="status" role="status"></p><details class="support-group"><summary>My request history</summary><div id="messages" aria-live="polite">Loading…</div></details></section>
<section id="ownerInbox" class="card" hidden style="margin-top:16px">
<h2>Owner support inbox</h2>
<p>Open a pending request to read it and reply.</p>
<p id="inboxStatus" role="status"></p>
<div id="inbox"></div>
<details id="answeredRequests" class="support-group"><summary>Answered requests</summary><div id="answeredList">Open to load answered requests.</div></details>
</section></main><script>
(async () => {
  const status = document.getElementById('status');
  const messages = document.getElementById('messages');
  const form = document.getElementById('form');
  const send = document.getElementById('send');
  const inbox = document.getElementById('inbox');
  const inboxStatus = document.getElementById('inboxStatus');
  const newRequest = document.getElementById('newRequest');
  const answeredRequests = document.getElementById('answeredRequests');
  const answeredList = document.getElementById('answeredList');
  const refreshButton = document.getElementById('refreshSupport');

  function textElement(tag, content) {
    const element = document.createElement(tag);
    element.textContent = content;
    return element;
  }

  try {
    if (!window.supabase) throw Error('Unable to load authentication.');
    const db = window.supabase.createClient('https://akxzubckdebawqwwwaoe.supabase.co','sb_publishable_XEeBfPCzJ0MzGpHWHygeug_rGptbzno');
    const { data: { user }, error } = await db.auth.getUser();
    if (error || !user) {
      location.replace('login.html');
      return;
    }

    const isOwner = user.app_metadata?.mzanconnect_role === 'owner';
    function renderRequest(request, ownerView) {
      const reply = Array.isArray(request.support_replies)
        ? request.support_replies[0] : request.support_replies;
      const item = document.createElement('details');
      item.className = 'item';
      const date = new Date(request.created_at).toLocaleString();
      item.append(
        textElement('summary', (reply ? 'Answered' : 'Awaiting reply') + ' · ' + date),
        textElement('p', request.message)
      );

      if (reply) {
        item.append(textElement('strong', 'Owner reply'), textElement('p', reply.message));
      } else if (ownerView) {
        const replyForm = document.createElement('form');
        const label = textElement('label', 'Your reply');
        const input = document.createElement('textarea');
        input.required = true;
        input.maxLength = 2000;
        label.append(input);
        const button = textElement('button', 'Save reply');
        const feedback = document.createElement('p');
        feedback.setAttribute('role', 'status');
        replyForm.append(label, button, feedback);
        replyForm.addEventListener('submit', async event => {
          event.preventDefault();
          const message = input.value.trim();
          if (!message || button.disabled) return;
          button.disabled = true;
          try {
            const { error } = await db.from('support_replies').insert({
              request_id: request.id, message, replied_by: user.id
            });
            if (error && error.code !== '23505') throw error;
            item.remove();
            status.textContent = error ? 'This request has already been answered.' : 'Reply saved.';
            await refreshSupport();
          } catch {
            feedback.textContent = 'Could not save the reply. Please try again.';
          } finally {
            button.disabled = false;
          }
        });
        item.append(replyForm);
      }
      return item;
    }

    const fields = 'id,user_id,message,created_at,support_replies(message,created_at)';
    async function refreshRequests(version) {
      const { data, error } = await db.from('support_messages').select(fields)
        .eq('user_id', user.id).order('created_at', { ascending: false }).limit(50);
      if (version !== refreshVersion) return;
      if (error) {
        messages.textContent = 'Unable to load your requests. Please refresh.';
        return;
      }
      messages.replaceChildren(...data.map(request => renderRequest(request, false)));
      if (!data.length) messages.textContent = 'No support requests yet.';
    }

    async function refreshInbox(version) {
      const { data, error } = await db.from('support_messages').select(fields)
        .is('support_replies', null).order('created_at', { ascending: false }).limit(50);
      if (version !== refreshVersion) return;
      if (error) {
        inboxStatus.textContent = 'Unable to refresh the inbox. Try again.';
        return;
      }
      inbox.replaceChildren(...data.map(request => renderRequest(request, true)));
      inboxStatus.textContent = data.length ? 'Showing pending requests.' : 'No pending requests.';
    }

    async function refreshAnswered(version) {
      const { data, error } = await db.from('support_messages').select(fields)
        .not('support_replies', 'is', null).order('created_at', { ascending: false }).limit(50);
      if (version !== refreshVersion) return;
      if (error) {
        answeredList.textContent = 'Unable to load answered requests. Try refreshing.';
        return;
      }
      answeredList.replaceChildren(...data.map(request => renderRequest(request, false)));
      if (!data.length) answeredList.textContent = 'No answered requests yet.';
    }

    let refreshVersion = 0;
    async function refreshSupport() {
      const version = ++refreshVersion;
      refreshButton.disabled = true;
      try {
        const tasks = [refreshRequests(version)];
        if (isOwner) {
          tasks.push(refreshInbox(version));
          if (answeredRequests.open) tasks.push(refreshAnswered(version));
        }
        await Promise.all(tasks);
      } catch {
        status.textContent = 'Could not refresh support. Please try again.';
      } finally {
        if (version === refreshVersion) refreshButton.disabled = false;
      }
    }

    if (isOwner) {
      document.getElementById('ownerInbox').hidden = false;
      answeredRequests.addEventListener('toggle', () => {
        if (answeredRequests.open) void refreshSupport();
      });
    }
    refreshButton.addEventListener('click', refreshSupport);
    await refreshSupport();

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('message').value.trim();
      if (!message || send.disabled) return;
      send.disabled = true;
      status.textContent = 'Saving…';
      try {
        const { error } = await db.from('support_messages').insert({ user_id: user.id, message });
        if (error) throw error;
        status.textContent = 'Support request saved to your account.';
        form.reset();
        newRequest.open = false;
        await refreshSupport();
      } catch {
        status.textContent = 'Could not save your request. Please try again.';
      } finally {
        send.disabled = false;
      }
    });
  } catch {
    status.textContent = 'Support is temporarily unavailable.';
    messages.textContent = 'Please try again later.';
  }
})();
</script><script defer src="legal-notices.js?v=1"></script><script defer src="voice-accessibility.js?v=6"></script><script defer src="app-shell.js?v=2"></script></body></html>
