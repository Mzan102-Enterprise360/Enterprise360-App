
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14283b">
<title>MzanConnect | Secure Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf2f5;color:#14283b}
header{background:#14283b;color:white;padding:28px 20px;text-align:center}
header h1{margin:0 0 10px}
header p{color:#c3d4df;line-height:1.5}
main{max-width:460px;margin:35px auto;padding:16px}
.card{background:white;padding:28px 22px;border-radius:18px;box-shadow:0 3px 12px #0001}
h2{text-align:center}
label{display:block;margin:16px 0 7px;font-weight:bold}
input{width:100%;padding:14px;border:1px solid #b7c5ce;border-radius:9px;font-size:16px}
button{width:100%;padding:15px;margin-top:22px;background:#147b59;color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
a{color:#147b59}
.links{text-align:center;margin-top:20px}
#message{display:none;padding:14px;margin-top:16px;border-radius:9px;background:#edf2f5;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>◈ MzanConnect</h1>
<p>One Connection. Endless Possibilities.</p>
<p>Business Opportunities &amp; Supplier Development</p>
</header>
<main>
<div class="card">
<h2>Welcome Back</h2>
<p style="text-align:center">Sign in to your MzanConnect account</p>

<form id="loginForm">
<label for="email">Email Address</label>
<input id="email" type="email" autocomplete="email" required>

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>

<button id="loginButton" type="submit">Sign In Securely</button>
</form>

<div id="message" role="status" aria-live="polite"></div>

<div class="links">
<p><a href="register.html">Join MzanConnect</a></p>
<p><a href="index.html">Back to Home</a></p>
</div>
</div>
</main>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm";

const supabase = createClient(
"https://akxzubckdebawqwwwaoe.supabase.co",
"sb_publishable_XEeBfPCzJ0MzGpHWHygeug_rGptbzno"
);

const form=document.getElementById("loginForm");
const message=document.getElementById("message");
const button=document.getElementById("loginButton");

form.addEventListener("submit",async(event)=>{
event.preventDefault();
button.disabled=true;
message.style.display="block";
message.textContent="Signing in securely...";

try{
const {error}=await supabase.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});
if(error)throw error;
message.textContent="Login successful! Opening dashboard...";
window.location.assign("dashboard.html");
}catch(error){
message.textContent=error.message||"Login failed. Please try again.";
}finally{
button.disabled=false;
}
});
</script>
</body>
</html>
