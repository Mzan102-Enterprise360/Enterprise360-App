
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14283b">
<link rel="manifest" href="manifest.webmanifest">
<title>Enterprise360</title>
<style>
:root{font-family:system-ui,Arial;color:#172c39;background:#edf2f5}
*{box-sizing:border-box}
body{margin:0}
header{background:#14283b;color:white;padding:20px 18px}
header small{color:#c3d4df}
main{max-width:650px;margin:auto;padding:16px 16px 90px}
.card{background:white;border-radius:15px;padding:17px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:110px;text-align:left}
button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#147b59;color:white;font-weight:650}
button.secondary{background:#e7eef2;color:#19354a}
button.tile{background:white;color:#173344;box-shadow:0 1px 5px #0002}
nav{position:fixed;bottom:0;background:white;display:flex;justify-content:space-around;width:100%;border-top:1px solid #dce4e8;padding:10px 2px}
nav button{background:transparent;color:#173344;font-size:12px;padding:9px}
input,select,textarea{width:100%;border:1px solid #bdcbd2;border-radius:9px;padding:11px;margin:5px 0 12px;font:inherit}
label{font-size:13px;font-weight:650}
h2{margin:6px 0 14px}
p{line-height:1.45}
.muted{color:#61717b;font-size:13px}
.pill{border-radius:100px;background:#e1f3e9;color:#147b59;padding:5px 10px;font-size:12px}
.chat{background:#e8f0eb;min-height:230px;padding:14px;border-radius:14px}
.bubble{background:white;padding:10px;border-radius:12px;margin:8px 0;max-width:85%}
.mine{background:#c6f3dc;margin-left:auto}
#view{min-height:400px}
</style>
</head>
<body>
<header>
<strong style="font-size:23px">◈ Enterprise360</strong><br>
<small>Empowering Her. Uplifting Youth. Growing Mzansi.</small><br>
<small>A division of Mzan 102 (Pty) Ltd · Demo</small>
</header>
<main><div id="view"></div></main>
<nav>
<button onclick="show('home')">⌂ Home</button>
<button onclick="show('chat')">☏ Chat</button>
<button onclick="show('opportunities')">▣ Explore</button>
<button onclick="show('business')">▤ Business</button>
<button onclick="show('admin')">⚙ Admin</button>
</nav>
<script>
const key='e360-demo-v1';
let state=JSON.parse(localStorage.getItem(key)||'{"business":"","sector":"","plan":"Starter","messages":[],"tasks":{}}');
function save(){localStorage.setItem(key,JSON.stringify(state))}
const el=document.getElementById('view');

function show(page){
let html='';

if(page==='home')html=`
<h2>Welcome to Enterprise360</h2>
<div class="card">
<span class="pill">Prototype · local demo</span>
<h3>${esc(state.business||'Your business growth hub')}</h3>
<p>Manage your business, opportunities and growth in one place.</p>
</div>
<div class="grid">
<button class="tile" onclick="show('business')">🏢<h3>My Business</h3>Profile & membership</button>
<button class="tile" onclick="show('compliance')">✓<h3>Compliance</h3>Business checklist</button>
<button class="tile" onclick="show('opportunities')">◈<h3>Opportunities</h3>Funding & tenders</button>
<button class="tile" onclick="show('growth')">↗<h3>Growth Passport</h3>Development goals</button>
</div>
<div class="card"><h3>Need assistance?</h3><button onclick="show('chat')">Open support chat</button></div>`;

if(page==='business')html=`
<h2>My Business</h2>
<div class="card">
<label>Business name</label>
<input id="business" value="${esc(state.business)}" placeholder="Enter business name">
<label>Business sector</label>
<input id="sector" value="${esc(state.sector||'')}" placeholder="e.g. Catering">
<label>Membership (demo)</label>
<select id="plan">${['Starter','Growth','Premium'].map(x=>`<option ${state.plan===x?'selected':''}>${x}</option>`).join('')}</select>
<button onclick="state.business=document.getElementById('business').value;state.sector=document.getElementById('sector').value;state.plan=document.getElementById('plan').value;save();show('business')">Save demo profile</button>
<p class="muted">Saved only on this device. No real registration or payments.</p>
</div>`;

if(page==='chat')html=`
<h2>Enterprise360 Chat</h2>
<div class="chat">
<div class="bubble">Welcome! How can we support your business?</div>
${state.messages.map(x=>`<div class="bubble mine">${esc(x)}</div>`).join('')}
</div>
<div class="card">
<label>Your message</label>
<textarea id="message" placeholder="Ask about funding, compliance or tenders"></textarea>
<button onclick="send()">Send demo message</button>
<p class="muted">This is a local chat simulation; messages are not sent to staff.</p>
</div>`;

if(page==='opportunities')html=`
<h2>Funding &amp; Tender Opportunities</h2>

<div class="card">
<h3>Discover Business Opportunities</h3>
<p>Explore funding, tenders, RFQs, grants and business development programmes to help your enterprise grow.</p>
<p class="muted">Enterprise360 is currently in demo mode. Check official sources for verified opportunities and closing dates.</p>
</div>

<div class="card">
<h3>Official South African Opportunities</h3>
<p>Find government tenders, RFQs, funding and business support programmes.</p>
<p><a href="https://www.etenders.gov.za/" target="_blank" rel="noopener noreferrer">Government Tenders and RFQs</a></p>
<p><a href="https://www.sedfa.org.za/" target="_blank" rel="noopener noreferrer">Small Business Funding and Support</a></p>
<p><a href="https://www.cidb.org.za/" target="_blank" rel="noopener noreferrer">Construction Industry Development Board</a></p>
<p class="muted">Check official websites for current opportunities, requirements and closing dates.</p>
</div>

<div class="card">
<h3>Northern Cape Mining Opportunities</h3>
<p>Explore official mining supplier registration and procurement information.</p>
<p><a href="https://www.angloamericankumba.com/suppliers" target="_blank" rel="noopener noreferrer">Kumba Iron Ore - Suppliers</a></p>
<p><a href="https://www.kudumane.com/apply-to-be-a-prospective-supplier/" target="_blank" rel="noopener noreferrer">Kudumane - Suppliers</a></p>
<p><a href="https://www.seio.co.za/become-a-supplier/" target="_blank" rel="noopener noreferrer">Sedibeng Iron Ore - Suppliers</a></p>
<p><a href="https://www.vedanta-zincinternational.com/procure/registration" target="_blank" rel="noopener noreferrer">Vedanta - Supplier Registration</a></p>
<p class="muted">Supplier links only. Check official websites for current opportunities.</p>
</div>

<div class="card">
<label for="opportunitySearch">Search Opportunities</label>
<input id="opportunitySearch" type="search" placeholder="Search funding, tenders or training">
<label for="opportunityCategory">Opportunity Category</label>
<select id="opportunityCategory">
<option value="all">All Categories</option>
<option value="funding">Funding</option>
<option value="tender">Tenders</option>
<option value="rfq">RFQs</option>
<option value="grant">Grants</option>
<option value="training">Training</option>
</select>
<button type="button" onclick="filterOpportunities()">🔍 Search</button>
</div>

${[
['Funding example','Small business expansion support','Example only — not a live funding call'],
['Tender example','Local supplier procurement','Example only — not a live tender'],
['Training example','Financial management workshop','Example only — not a live event']
].map(x=>`
<div class="card opportunity-item">
<span class="pill">${x[0]}</span>
<h3>${x[1]}</h3>
<p>${x[2]}</p>
<button class="secondary" onclick="show('chat')">Ask for assistance</button>
</div>`).join('')}`;

if(page==='compliance')html=`
<h2>Compliance Checklist</h2>
<p class="muted">Personal checklist only; does not verify official compliance.</p>
${['CIPC records','SARS tax status','CSD registration','B-BBEE documents','Relevant industry licences'].map((x,i)=>`
<div class="card"><label><input type="checkbox" style="width:auto" ${state.tasks['c'+i]?'checked':''} onchange="state.tasks['c${i}']=this.checked;save()"> ${x}</label></div>`).join('')}`;

if(page==='growth')html=`
<h2>Business Growth Passport</h2>
<p>Mark your business development milestones.</p>
${['Complete business assessment','Review compliance','Prepare funding documents','Identify procurement opportunities','Complete monthly business review'].map((x,i)=>`
<div class="card"><label><input type="checkbox" style="width:auto" ${state.tasks['g'+i]?'checked':''} onchange="state.tasks['g${i}']=this.checked;save()"> ${x}</label></div>`).join('')}`;

if(page==='admin')html=`
<h2>Administrator Preview</h2>
<div class="card">
<h3>Example dashboard</h3>
<p>Member: ${esc(state.business||'Not registered')}</p>
<p>Plan: ${esc(state.plan)}</p>
<p>Demo chat messages: ${state.messages.length}</p>
<p class="muted">This is NOT a secure staff portal. Production admin access requires authentication and role permissions.</p>
</div>
<button class="secondary" onclick="if(confirm('Erase demo data on this device?')){localStorage.removeItem(key);location.reload()}">Reset demo</button>`;

el.innerHTML=html;
window.scrollTo(0,0);
}

function esc(s){
return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function filterOpportunities(){
const search=document.getElementById('opportunitySearch').value.toLowerCase().trim();
const category=document.getElementById('opportunityCategory').value;
document.querySelectorAll('.opportunity-item').forEach(card=>{
const text=card.textContent.toLowerCase();
const matchesSearch=text.includes(search);
const matchesCategory=category==='all'||card.querySelector('.pill').textContent.toLowerCase().includes(category);
card.style.display=matchesSearch&&matchesCategory?'':'none';
});
}

function send(){
let v=document.getElementById('message').value.trim();
if(v){state.messages.push(v);save();show('chat')}
}

show(['business','compliance','opportunities'].includes(window.location.hash.slice(1))?window.location.hash.slice(1):'home');

if('serviceWorker' in navigator)
navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
<script src="home-buttons.js"></script>
</body>
</html>
