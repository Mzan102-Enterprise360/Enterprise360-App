
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14283b">
<meta name="description" content="MzanConnect connects South African entrepreneurs, women, youth and SMMEs with business funding, tenders, mining supplier opportunities and enterprise development. Not a job application portal.">
<link rel="manifest" href="manifest.webmanifest">
<title>MzanConnect | Business Opportunities</title>
<style>
:root{font-family:system-ui,Arial;color:#172c39;background:#edf2f5}
*{box-sizing:border-box}
body{margin:0}
header{background:#14283b;color:white;padding:20px 18px}
header small{color:#c3d4df}
main{max-width:650px;margin:auto;padding:16px 16px 90px}
.card{background:white;border-radius:15px;padding:17px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:110px;text-align:left}

button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#087f8c;color:white;font-weight:650;transition:background .2s ease,transform .2s ease}

button.tile{background:white;color:#173344;box-shadow:0 1px 5px #0002}

button.secondary{background:#e7eef2;color:#19354a}

nav{position:fixed;bottom:0;background:white;display:flex;justify-content:space-around;width:100%;border-top:1px solid #dce4e8;padding:10px 2px}
nav button{background:transparent;color:#173344;font-size:12px;padding:9px}
input,select,textarea{width:100%;border:1px solid #bdcbd2;border-radius:9px;padding:11px;margin:5px 0 12px;font:inherit}
label{font-size:13px;font-weight:650}
h2{margin:6px 0 14px}
p{line-height:1.45}
.muted{color:#61717b;font-size:13px}
.pill{border-radius:100px;background:#e1f3e9;color:#147b59;padding:5px 10px;font-size:12px}
.chat{background:#e8f0eb;min-height:230px;padding:14px;border-radius:14px}
.bubble{background:white;padding:10px;border-radius:12px;margin:8px 0;max-width:85%}
.mine{background:#c6f3dc;margin-left:auto}
#view{min-height:400px}
.member-access-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
.member-access-buttons a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:12px 8px;border-radius:11px;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.member-access-buttons a:first-child{background:#147b59}
.member-access-buttons a:last-child{background:#14283b}
@media(max-width:350px){.member-access-buttons{grid-template-columns:1fr}}


/* Premium MzanConnect accents: restrained depth and branded surfaces */
header{background:linear-gradient(125deg,#14283b 0%,#163b50 65%,#116a71 100%)}
.card{border:1px solid #dfe9ec;box-shadow:0 5px 18px rgba(20,40,59,.07)}
button.tile{border:1px solid #dfe9ec;box-shadow:0 5px 15px rgba(20,40,59,.08)}
button.tile:focus-visible,button:focus-visible{outline:3px solid #12a3a8;outline-offset:2px}
/* Balanced compact spacing: preserve readable text and touch targets */
@media screen {
header{padding:14px 16px}
main{padding:12px 14px 76px}
.card{padding:14px;margin-bottom:10px}
.grid{gap:10px}
.tile{min-height:88px}
#view{min-height:0}
h2{margin:5px 0 10px}
h3{margin:8px 0}
p{margin:9px 0;line-height:1.48}
nav{padding:5px 2px env(safe-area-inset-bottom)}
nav button{min-height:44px;padding:8px 5px}
.member-access-buttons{margin-bottom:10px}
}
/* Contextual opportunities heading in navy header; avoid repeated page title */
header .brand-extra[hidden],header #opportunityHeaderDescription[hidden]{display:none!important}
header #opportunityHeaderDescription{color:#e0edf0;font-size:14px;line-height:1.4;margin:7px 0 0;max-width:650px}
/* Screenshot-led compact opportunity navigation */
@media screen {
#view .opportunity-return{padding:7px 9px!important;margin-bottom:10px}
#view .opportunity-return button{min-height:46px!important;padding:9px 12px!important;font-size:16px!important}
#view .opportunity-intro{margin:7px 0 12px;line-height:1.45}
}

/* Branded mobile-first welcome cover: visual only, existing routes preserved */
.welcome-cover{position:relative;overflow:hidden;isolation:isolate;border-radius:22px;background:linear-gradient(145deg,#10273b 0%,#174458 55%,#087f84 100%);color:#fff;padding:30px 22px 25px;box-shadow:0 15px 35px rgba(13,51,68,.17);margin-bottom:15px}
.cover-orb{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}.cover-orb-one{width:240px;height:240px;right:-100px;top:-105px;border:34px solid rgba(139,245,217,.13)}.cover-orb-two{width:180px;height:180px;left:-100px;bottom:-100px;background:rgba(46,203,185,.12)}
.cover-content{position:relative;max-width:520px;margin:auto;text-align:center}
.cover-eyebrow{font-size:11px;font-weight:800;letter-spacing:.19em;color:#aaf0e4}
.cover-mark{font-size:30px;color:#b9ffdd;margin:7px auto 3px}
.welcome-cover h1{font-size:clamp(30px,7vw,43px);line-height:1.14;letter-spacing:-.035em;margin:6px 0 13px;font-weight:800}
.welcome-cover h1 em{font-style:normal;color:#8cf1d8}
.cover-lead{font-size:15px;line-height:1.55;max-width:340px;margin:0 auto 12px;color:#e6f5f5}
.cover-tagline{font-size:12px;font-weight:750;letter-spacing:.025em;color:#aaf0e4;margin-bottom:19px}
.cover-actions{margin-bottom:10px}
.cover-actions a:first-child{background:#19a688;color:#fff}.cover-actions a:last-child{background:#fff;color:#143344}
.cover-actions a{min-height:49px;transition:transform .2s,box-shadow .2s}
.cover-actions a:focus-visible,.cover-explore:focus-visible{outline:3px solid #ffcc70;outline-offset:3px}
.cover-explore{width:100%;background:transparent;border:1px solid #9bd5d2;color:#fff;min-height:45px;font-size:14px}
.home-discovery{text-align:center;padding:4px 0 9px}.home-discovery h2{font-size:18px;margin:4px 0 12px}
.home-feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.home-feature{background:#fff;border:1px solid #dce9e9;border-radius:13px;padding:12px 7px;display:flex;align-items:center;flex-direction:column;gap:5px;min-width:0}
.home-feature>span{color:#087f8c;font-size:23px}.home-feature strong{font-size:12px;line-height:1.3}.home-feature small{font-size:11px;color:#61717b;line-height:1.3}
.home-disclaimer{font-size:11px;color:#61717b;margin:13px 0}
@media(max-width:390px){.welcome-cover{padding:24px 14px 20px}.home-feature-grid{gap:5px}.home-feature{padding:10px 5px}}
@media(prefers-reduced-motion:no-preference){.welcome-cover{animation:cover-in .5s ease-out both}@keyframes cover-in{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>

<header>
<strong id="pageHeading" style="font-size:23px">◈ MzanConnect</strong><br>

<small id="pageSubtitle">One Connection. Endless Possibilities.</small><br>
<p id="opportunityHeaderDescription" hidden>Search official sources for funding, tenders, supplier registration and business development. Check each source for current listings, requirements and deadlines.</p>

<small class="brand-extra">Empowering Her. Uplifting Youth. Growing Mzansi.</small><br class="brand-extra">
<small class="brand-extra">A division of Mzan 102 (Pty) Ltd</small>
</header>

<main><div id="view"></div></main>

<nav>
<button onclick="show('home')">⌂ Home</button>
<button onclick="location.href='support.html'">☏ Support</button>
<button onclick="show('opportunities')">▣ Explore</button>
<button onclick="location.href='member.html'">▤ Business</button>
<button onclick="location.href='dashboard.html'">⚙ Dashboard</button>
</nav>

<script>
const key='e360-demo-v1';

let state=JSON.parse(localStorage.getItem(key)||'{"business":"","sector":"","plan":"Starter","messages":[],"tasks":{}}');

function save(){
localStorage.setItem(key,JSON.stringify(state));
}

const el=document.getElementById('view');

function show(page){
const opportunityPage=page==='opportunities';
document.getElementById('pageHeading').textContent=opportunityPage?'Funding & Tender Opportunities':'◈ MzanConnect';
document.getElementById('pageSubtitle').textContent=opportunityPage?'Official sources and supplier opportunities':'One Connection. Endless Possibilities.';
document.getElementById('opportunityHeaderDescription').hidden=!opportunityPage;
for(const item of document.querySelectorAll('.brand-extra'))item.hidden=opportunityPage;
let html='';

if(page==='home')html=`
<section class="welcome-cover" aria-labelledby="coverTitle">
  <div class="cover-orb cover-orb-one" aria-hidden="true"></div><div class="cover-orb cover-orb-two" aria-hidden="true"></div>
  <div class="cover-content">
    <span class="cover-eyebrow">WELCOME TO MZANCONNECT</span>
    <div class="cover-mark" aria-hidden="true">✦</div>
    <h1 id="coverTitle">Your business.<br><em>New possibilities.</em></h1>
    <p class="cover-lead">Discover opportunities. Build your business. Move forward with confidence.</p>
    <p class="cover-tagline">One Connection. Endless Possibilities.</p>
    <div class="member-access-buttons cover-actions" aria-label="Member registration and login"><a href="register.html">Join MzanConnect</a><a href="login.html">Member Login</a></div>
    <button type="button" class="cover-explore" onclick="show('opportunities')" aria-label="Explore funding, tenders and supplier opportunities">Explore Opportunities <span aria-hidden="true">→</span></button>
  </div>
</section>
<section class="home-discovery" aria-label="What you can do on MzanConnect">
  <h2>Where will your business go next?</h2>
  <div class="home-feature-grid">
    <div class="home-feature"><span aria-hidden="true">◈</span><strong>Find opportunities</strong><small>Funding, tenders and suppliers</small></div>
    <div class="home-feature"><span aria-hidden="true">▣</span><strong>Grow with support</strong><small>Business tools and guidance</small></div>
    <div class="home-feature"><span aria-hidden="true">✓</span><strong>Stay organised</strong><small>Compliance and bookkeeping</small></div>
  </div>
  <p class="home-disclaimer">Built for entrepreneurs, women, youth and SMMEs. MzanConnect is not a job application portal.</p>
</section>`;

if(page==='business')html=`
<h2>My Business</h2>
<div class="card">

<label>Business name</label>
<input id="business" value="${esc(state.business)}" placeholder="Enter business name">

<label>Business sector</label>
<input id="sector" value="${esc(state.sector||'')}" placeholder="e.g. Catering, Mining Services">

<label>Membership (demo)</label>
<select id="plan">
${['Starter','Growth','Premium'].map(x=>`
<option ${state.plan===x?'selected':''}>${x}</option>
`).join('')}
</select>

<button onclick="state.business=document.getElementById('business').value;state.sector=document.getElementById('sector').value;state.plan=document.getElementById('plan').value;save();show('business')">
Save demo profile
</button>

<p class="muted">Saved only on this device. No real registration or payments.</p>
</div>`;

if(page==='chat')html=`
<h2>MzanConnect Chat</h2>

<div class="chat">
<div class="bubble">
Welcome to MzanConnect! How can we support your business?
</div>

${state.messages.map(x=>`
<div class="bubble mine">${esc(x)}</div>
`).join('')}
</div>

<div class="card">
<label>Your message</label>
<textarea id="message" placeholder="Ask about business funding, compliance or tenders"></textarea>

<button onclick="send()">Send demo message</button>

<p class="muted">This is a local chat simulation; messages are not sent to staff.</p>
</div>`;

if(page==='opportunities')html=`
<div class="card opportunity-return"><button type="button" onclick="returnToDashboard()" style="width:100%;text-align:center;background:#147b59;color:white;min-height:48px;font-size:16px" aria-label="Return to member dashboard">← Back to Dashboard</button></div>
<div class="card">
<form onsubmit="event.preventDefault();filterOpportunities()">
<label for="opportunitySearch">Search official sources</label>
<input id="opportunitySearch" type="search" placeholder="Try mining, funding or Kumba" oninput="filterOpportunities()">
<label for="opportunityCategory">Opportunity Category</label>
<select id="opportunityCategory" onchange="filterOpportunities()">
<option value="all">All Categories</option>
<option value="funding">Funding</option>
<option value="tender">Tenders</option>
<option value="rfq">RFQs</option>
<option value="grant">Grants</option>
<option value="training">Training</option>
<option value="supplier">Supplier Registration</option>
<option value="mining">Mining</option>
</select>
<button type="submit">Search</button>
</form>
<p id="opportunityResults" role="status">Official sources</p>
</div>
<article class="card opportunity-item" data-categories="funding grant training">
<h3><a href="https://www.sedfa.org.za/" target="_blank" rel="noopener noreferrer">SEDFA</a></h3>
<p>Find small business funding, grants where available, and enterprise training.</p>
</article>
<article class="card opportunity-item" data-categories="supplier mining">
<h3><a href="https://www.angloamericankumba.com/suppliers" target="_blank" rel="noopener noreferrer">Kumba Iron Ore</a></h3>
<p>Access supplier information and procurement guidance.</p>
</article>
<article class="card opportunity-item" data-categories="supplier mining">
<h3><a href="https://arm.co.za/arm-ferrous/" target="_blank" rel="noopener noreferrer">Assmang</a></h3>
<p>View information about Assmang mining operations, including Khumani and Black Rock. Confirm supplier registration requirements directly with the mine.</p>
</article>
<article class="card opportunity-item" data-categories="supplier mining">
<h3><a href="https://www.south32.net/suppliers" target="_blank" rel="noopener noreferrer">South32 Suppliers</a></h3>
<p>Access South32 supplier guidance, requirements and procurement information.</p>
</article>
<article class="card opportunity-item" data-categories="supplier mining tender rfq">
<h3><a href="https://www.kudumane.com/apply-to-be-a-prospective-supplier/" target="_blank" rel="noopener noreferrer">Kudumane Manganese Resources</a></h3>
<p>Apply as a prospective supplier for future quotes and tenders.</p>
</article>
<article class="card opportunity-item" data-categories="supplier mining">
<h3><a href="https://www.seio.co.za/become-a-supplier/" target="_blank" rel="noopener noreferrer">Sedibeng Iron Ore</a></h3>
<p>Find supplier registration information.</p>
</article>
<article class="card opportunity-item" data-categories="supplier mining">
<h3><a href="https://www.vedanta-zincinternational.com/procure/registration" target="_blank" rel="noopener noreferrer">Vedanta Zinc International</a></h3>
<p>Register interest in joining the supplier network.</p>
</article>
<details class="card"><summary>View sample opportunities</summary>
${[
['Funding example','Small business expansion support','Example only — not a live funding call'],
['Tender example','Local supplier procurement','Example only — not a live tender'],
['Training example','Financial management workshop','Example only — not a live event']
].map(x=>`
<div class="card">
<span class="pill">${x[0]}</span>
<h3>${x[1]}</h3>
<p>${x[2]}</p>
<button class="secondary" onclick="location.href='support.html'">Ask for assistance</button>
</div>
`).join('')}
</details>`;

if(page==='compliance')html=`
<h2>Compliance Checklist</h2>
<p class="muted">Personal checklist only; does not verify official compliance.</p>

${[
'CIPC records',
'SARS tax status',
'CSD registration',
'B-BBEE documents',
'Relevant industry licences'
].map((x,i)=>`
<div class="card">
<label>
<input type="checkbox" style="width:auto"
${state.tasks['c'+i]?'checked':''}
onchange="state.tasks['c${i}']=this.checked;save()">
${x}
</label>
</div>
`).join('')}`;

if(page==='growth')html=`
<h2>Growth Passport Preview</h2>
<p>These sample milestones are saved on this device. <a href="member.html?section=growth">Open your account’s Growth Passport</a> to save progress to your account.</p>

${[
'Complete business assessment',
'Review compliance',
'Prepare funding documents',
'Identify procurement opportunities',
'Complete monthly business review'
].map((x,i)=>`
<div class="card">
<label>
<input type="checkbox" style="width:auto"
${state.tasks['g'+i]?'checked':''}
onchange="state.tasks['g${i}']=this.checked;save()">
${x}
</label>
</div>
`).join('')}`;

if(page==='admin')html=`
<h2>Administrator Preview</h2>

<div class="card">
<h3>Example dashboard</h3>
<p>Member: ${esc(state.business||'Not registered')}</p>
<p>Plan: ${esc(state.plan)}</p>
<p>Demo chat messages: ${state.messages.length}</p>
<p class="muted">This is NOT a secure staff portal. Production admin access requires authentication and role permissions.</p>
</div>

<button class="secondary" onclick="if(confirm('Erase demo data on this device?')){localStorage.removeItem(key);location.reload()}">
Reset demo
</button>`;

el.innerHTML=html;
window.scrollTo(0,0);
}

function esc(s){
return String(s||'').replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);
}

function filterOpportunities(){
const terms = document.getElementById('opportunitySearch').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
const category = document.getElementById('opportunityCategory').value;
let matches = 0;

for (const card of document.querySelectorAll('.opportunity-item')) {
  const categories = card.dataset.categories.split(' ');
  const text = (card.textContent + ' ' + card.dataset.categories).toLowerCase();
  const visible = (category === 'all' || categories.includes(category)) && terms.every(term => text.includes(term));
  card.hidden = !visible;
  if (visible) matches++;
}

document.getElementById('opportunityResults').textContent =
  matches === 0 ? 'No official sources match. Try a different search or category.' :
  matches === 1 ? '1 official source found.' : matches + ' official sources found.';
}

function send(){
let v=document.getElementById('message').value.trim();
if(v){
state.messages.push(v);
save();
show('chat');
}
}

function returnToDashboard(){
  // Navigate to the protected dashboard without retaining the Opportunities hash.
  window.location.assign(new URL('dashboard.html',document.baseURI).href);
}

function showFromUrl(){
const page=window.location.hash.slice(1);
show(['home','business','compliance','opportunities','growth','chat'].includes(page)?page:'home');
}
window.addEventListener('hashchange',showFromUrl);
showFromUrl();

if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>

<!-- Member access buttons appear only on the Home view. -->
<script defer src="voice-accessibility.js?v=1"></script><script defer src="legal-notices.js?v=1"></script></body>
</html>
