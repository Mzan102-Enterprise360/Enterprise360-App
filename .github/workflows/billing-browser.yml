name: Billing browser checks
on:
  push:
    branches: [main]
    paths:
      - 'billing.html'
      - 'company-sponsorship.js'
      - 'support.html'
      - 'bookkeeping.html'
      - 'dashboard.html'
      - 'member.html'
      - 'growth-passport-status.js'
      - 'survey.html'
      - 'donations.html'
      - 'donation-report.html'
      - 'donation-report.js'
      - 'donation-requests.js'
      - 'business-service-requests.js'
      - 'business-support.html'
      - 'business-report.html'
      - 'business-profile-options.js'
      - 'business-profile-bootstrap.js'
      - 'register.html'
      - 'login.html'
      - 'owner-security.html'
      - 'reset-password.html'
      - 'tests/*.cjs'
      - '.github/workflows/billing-browser.yml'
  pull_request:
    paths:
      - 'billing.html'
      - 'company-sponsorship.js'
      - 'support.html'
      - 'bookkeeping.html'
      - 'dashboard.html'
      - 'member.html'
      - 'growth-passport-status.js'
      - 'survey.html'
      - 'donations.html'
      - 'donation-report.html'
      - 'donation-report.js'
      - 'donation-requests.js'
      - 'business-service-requests.js'
      - 'business-support.html'
      - 'business-report.html'
      - 'business-profile-options.js'
      - 'business-profile-bootstrap.js'
      - 'register.html'
      - 'login.html'
      - 'owner-security.html'
      - 'reset-password.html'
      - 'tests/*.cjs'
      - '.github/workflows/billing-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test billing navigation and access
        run: node tests/billing-browser.cjs
      - name: Test self-funded and company-funded memberships
        run: node tests/company-sponsorship-browser.cjs
      - name: Test donation request journeys
        run: node tests/donation-browser.cjs
      - name: Test consolidated donation report and printing
        run: node tests/donation-report-browser.cjs
      - name: Test compliance uploads and auto-checks
        run: node tests/compliance-documents.cjs
      - name: Test live growth passport and survey linking
        run: node tests/growth-passport-browser.cjs
      - name: Test corporate business profile fields and printed reports
        run: node tests/business-profile-browser.cjs
